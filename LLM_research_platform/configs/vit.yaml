seed: 42
device: auto

data:
  extracted_path: "/content/drive/MyDrive/VLM_DATA/CC3M/normal"
  shared_path: "/content/drive/MyDrive/VLM_DATA/CC3M/shards"
  patch_size: 16
  max_len: 256
  color: 3
  batch_size: 8
  validation_batch_size: 128
  shuffle: True
  image_only: False

tokenizer:
  vocab_size: 10000
  pattern: gpt2

model:
  d_model: 384
  n_layers: 6
  n_heads: 6
  rope: True
  cross_attention: False
  rope_dims: [64]
  dropout: 0.2

training:
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.01
  accumulation_steps: 8
  max_grad_norm: 1.0
  training_file: "training.txt"
  validation_file: "validation.txt"

logging:
  enabled: true
  project: my-gpt
  log_every_batches: 100
  print_every_batches: 250